# Zeichnet Blatt 03 (Jahresbilanz) jede Nacht aus dem Beitragskalender neu.
name: Jahresbilanz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", ".github/workflows/skyline.yml"]

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Blatt 03 zeichnen
        run: python scripts/render-skyline.py
        env:
          # Ein eigener Token (read:user) nur, falls der eingebaute nicht reicht.
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Committen, wenn sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline-*.svg
          git diff --cached --quiet || { git commit -m "chore: Jahresbilanz neu gezeichnet"; git push; }
